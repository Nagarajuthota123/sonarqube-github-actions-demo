name: SonarQube Analysis
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  unit-tests:
    name: unit testing 
    runs-on: ubuntu-latest
    steps:
      #step 1: checkout the code
      - name: checkout the code
        uses: actions/checkout@v4
      #step 2: set up node environment
      - name: set the node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      #step 3: install dependencies
      - name: install dependencies
        run: npm install
      #step 4: run unit tests
      - name: run unit tests
        run: npm test
      #step 5: upload test results
      - name: upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retain-days: 7

  SonarQube-Analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      #step 1: checkout the code
      - name: checkout the code
        uses: actions/checkout@v4
      #step 2: set up node environment
      - name: set the node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      #step 3: install dependencies
      - name: install dependencies
        run: npm install
      #step 4: download test results from previous job
      - name: download test results from previous job
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: coverage/
      #step 5: verify the coverage report exists
      - name: verify the coverage report exists
        run: ls -l coverage/
      #step 6: run SonarQube analysis
      - name: run SonarQube analysis
        uses: sonarsource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Demo-project
            -Dsonar.projectName="Demo-project"
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.test.js
            -Dsonar.exclusions=node_modules/**,coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
        #Step 7: sonarqube quality gate check
      - name: sonarqube quality gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          host-url: ${{ secrets.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}